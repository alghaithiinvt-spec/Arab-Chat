<style>

/* ===== نظام الثيم الاحترافي المضاف ===== */
:root{
  --bg:#0c0c0d; --card:#1E1E1F; --card2:#252529; --bd:#2A2A32; --bd2:#3A3A4A;
  --tx:#FFFFFF; --tx2:#E5E5E7; --mut:#9A9AAA; --gray:#9A9AAA;
  --shadow:0 8px 24px rgba(0,0,0,.4);
}
[data-theme="light"]{
  --bg:#F5F5F7 !important; --card:#FFFFFF !important; --card2:#F0F0F3 !important; --bd:#E5E5EA !important; --bd2:#D1D1D6 !important;
  --tx:#121212 !important; --tx2:#2C2C2E !important; --mut:#8E8E93 !important; --gray:#8E8E93 !important;
  --shadow:0 8px 24px rgba(0,0,0,.08) !important;
}
[data-theme="dark"]{
  --bg:#0c0c0d !important; --card:#1E1E1F !important; --card2:#252529 !important; --bd:#2A2A32 !important; --bd2:#3A3A4A !important;
  --tx:#FFFFFF !important; --tx2:#E5E5E7 !important; --mut:#9A9AAA !important;
}
@media(prefers-color-scheme: light){
  html[data-theme="auto"]{ --bg:#F5F5F7; --card:#FFFFFF; --card2:#F0F0F3; --bd:#E5E5EA; --bd2:#D1D1D6; --tx:#121212; --tx2:#2C2C2E; --mut:#8E8E93; --gray:#8E8E93; }
}
html{transition:background .3s, color .3s}
html[data-theme="light"] body, html[data-theme="light"] .pf{background:var(--bg)}
/* تحسين قائمة الرسائل الاحترافية */
.messages-header{display:flex; align-items:center; justify-content:space-between; padding:0 20px 12px}
.messages-header h2{margin:0; font-size:22px; font-weight:800}
.edit-icon{width:40px; height:40px; border-radius:12px; background:var(--card); border:1px solid var(--bd); display:grid; place-items:center; cursor:pointer}
.search-bar{margin:0 16px 12px; background:var(--card); border:1px solid var(--bd); border-radius:16px; padding:12px 14px; display:flex; align-items:center; gap:10px}
.search-bar:focus-within{border-color:var(--pr); box-shadow:0 0 0 3px rgba(255,61,129,.12)}
.search-bar input{flex:1; background:none; border:0; outline:0; color:var(--tx); font-size:14px}
.msg-tabs{display:flex; gap:8px; padding:0 16px 14px; overflow-x:auto}
.mtab{flex:0 0 auto; padding:8px 16px; border-radius:20px; background:var(--card); border:1px solid var(--bd); font-size:13px; font-weight:600; color:var(--mut); cursor:pointer}
.mtab.active{background:rgba(255,61,129,.12); border-color:var(--pr); color:var(--pr)}
.msg-list{padding:0 12px 20px; display:flex; flex-direction:column; gap:2px}
.msg-row{display:flex !important; align-items:center; gap:12px; padding:14px 14px !important; border-radius:18px !important; background:var(--card) !important; border:1px solid transparent !important; cursor:pointer; transition:all .2s !important}
.msg-row:hover{border-color:var(--bd) !important; transform:translateY(-1px); box-shadow:var(--shadow,0 8px 24px rgba(0,0,0,.4))}
.msg-av{width:52px !important; height:52px !important; border-radius:50%; font-size:20px !important; border:2px solid var(--bg) !important; position:relative}
.msg-online{position:absolute; bottom:1px; inset-inline-end:1px; width:12px; height:12px; border-radius:50%; background:#00D44A; border:2px solid var(--card)}
.msg-content{flex:1; min-width:0; display:flex; flex-direction:column; gap:3px}
.msg-top{display:flex; align-items:center; justify-content:space-between; gap:8px}
.msg-name{font-size:15px; font-weight:700; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; color:var(--tx)}
.msg-time{font-size:11px; color:var(--mut); flex:none; direction:ltr}
.msg-preview{font-size:13px; color:var(--mut); white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
.msg-preview.unread{color:var(--tx2); font-weight:600}
.msg-badge{background:var(--pr); color:#fff; font-size:11px; font-weight:800; min-width:20px; height:20px; border-radius:10px; display:grid; place-items:center; padding:0 6px}
.mcall{width:36px; height:36px; border-radius:50%; background:var(--card2, #252529); border:1px solid var(--bd); display:grid; place-items:center; cursor:pointer}
/* ثيم سيليكتور في الإعدادات */
.theme-group{padding:12px 16px}
.theme-title{font-size:13px; font-weight:700; color:var(--tx); margin-bottom:10px; display:flex; gap:8px; align-items:center}
.theme-options{display:grid; grid-template-columns:repeat(3,1fr); gap:8px}
.theme-opt{position:relative; border-radius:16px; border:2px solid var(--bd); background:var(--card2); padding:12px 8px; display:flex; flex-direction:column; align-items:center; gap:8px; cursor:pointer; transition:.2s; font-family:inherit}
.theme-opt.on{border-color:var(--pr); background:rgba(255,61,129,.08); box-shadow:0 0 0 3px rgba(255,61,129,.12)}
.theme-opt-icon{width:42px; height:42px; border-radius:12px; display:grid; place-items:center; font-size:20px; background:var(--card); border:1px solid var(--bd)}
.theme-opt.on .theme-opt-icon{background:linear-gradient(135deg,#FF3D81,#8B3DFF); color:#fff; border-color:transparent}
.theme-opt-name{font-size:12px; font-weight:700; color:var(--tx)}
.theme-opt-desc{font-size:10px; color:var(--mut)}
.theme-check{position:absolute; top:6px; inset-inline-end:6px; width:18px; height:18px; border-radius:50%; background:var(--pr); color:#fff; display:grid; place-items:center; font-size:10px; opacity:0; transform:scale(.5); transition:.2s}
.theme-opt.on .theme-check{opacity:1; transform:scale(1)}

/* ===== توافق المتغيرات + تعديلات الدمج ===== */

[hidden]{display:none!important}
body{padding-bottom:calc(84px + env(safe-area-inset-bottom,0px))}

main{display:block}
.header{padding-top:calc(10px + env(safe-area-inset-top,0px))}

      return (data || []).map(x => [x.path, x.data]);
    };
    const mk = (rows, prev) => { const docs = rows.map(([k, x]) => snapD(k, x)); return { docs, size: docs.length, empty: !docs.length, metadata: {}, docChanges: () => docs.filter(d => !prev.has(d.id)).map(doc => ({ type: "added", doc })) }; };
    return {
      doc: id => docRef(path + "/" + id),
      where: (f, op, v) => col(path, { ...q, w: [...q.w, [f, op, v]] }),
      orderBy: (f, dir) => col(path, { ...q, o: [f, dir] }),
      limit: n => col(path, { ...q, l: n }),
      get: async () => mk(await run(), new Set()),
      onSnapshot(cb) {
        let prev = new Set(), last, alive = true;
        const f = async () => { try { const rows = await run(), j = JSON.stringify(rows); if (!alive || j === last) return; last = j; const s = mk(rows, prev); prev = new Set(s.docs.map(d => d.id)); cb(s); } catch (e) { console.error(e); } };
        subs.add(f); f(); return () => { alive = false; subs.delete(f); };
      }
    };
  }
  function docRef(path) {
    const get = async () => { const { data, error } = await sb.from(T).select("data").eq("path", path).maybeSingle(); if (error) throw error; return snapD(path, data ? data.data : undefined); };
    const set = async v => { const { error } = await sb.from(T).upsert({ path, parent: par(path), data: v, updated_at: new Date().toISOString() }); if (error) throw error; notify(); };
    return {
      id: path.split("/").pop(), path, get, set,
      update: async v => { const c = (await get()).data() || {}; await set({ ...c, ...v }); },
      delete: async () => { const { error } = await sb.from(T).delete().or(`path.eq.${path},path.like.${path}/*`); if (error) throw error; notify(); },
      collection: p => col(path + "/" + p),
      onSnapshot(cb) {
        let last, alive = true;
        const f = async () => { try { const s = await get(), j = JSON.stringify(s.data()); if (!alive || j === last) return; last = j; cb(s); } catch (e) { console.error(e); } };
        subs.add(f); f(); return () => { alive = false; subs.delete(f); };
      }
    };
  }
  const db = { collection: p => col(p) };
  const user = { id: async () => window.__uid, me: async () => ({ name: window.__name || "" }) };
  window.claude = { use: async n => n === "db" ? db : n === "user" ? user : null };
})();

  if('serviceWorker' in navigator && Notification.permission==='granted'){

async function initWebPush(){

      const t = payload.notification?.title || payload.data?.title || 'رسالة جديدة';

// --- Capacitor Push للتطبيق Native (Android/iOS) مثل واتساب تماما ---
async function initNativePush(){
  const cap = window.Capacitor;
  if(!cap || !cap.isNativePlatform || !cap.isNativePlatform()) return;
  try{
    const {PushNotifications} = cap.Plugins;
    if(!PushNotifications) return;
    let perm = await PushNotifications.requestPermissions();
    if(perm.receive!=='granted') return;
    await PushNotifications.register();

    PushNotifications.addListener('registration', async token=>{
      console.log('Push token', token.value);
      await savePushToken(token.value, cap.getPlatform());
    });
    PushNotifications.addListener('registrationError', err=> console.warn('Push reg err', err));
    PushNotifications.addListener('pushNotificationReceived', notif=>{
      // التطبيق مفتوح وجاءت رسالة - اعرضها
      showAppNotification({
        title: notif.title||'رسالة جديدة',
        body: notif.body|| notif.data?.body||'',
        tag: notif.data?.chatId||'push',

      // المستخدم ضغط الإشعار وهو خارج التطبيق - افتح المحادثة
      const chatId = action.notification.data?.chatId;
      if(chatId){
        setTimeout(()=>{ tab='c'; render(); openChat(chatId); }, 600);
      }
    });
  }catch(e){ console.warn('Native push init fail', e); }
}

function drawList(){

  else if(mtab==="groups") l=l.filter(c=>c.type==="group");

    const chk=r.querySelector('.check'); if(chk) chk.onclick=e=>{ e.stopPropagation(); toggleSelect(id); };
    let startX=0, curTrans=0, dragging=false;
    const setTrans=(x)=>{ r.style.transform=`translateX(${x}px)`; };
    const onStart=(cx)=>{ startX=cx; dragging=true; r.style.transition='none'; };
    const onMove=(cx)=>{ if(!dragging) return; let dx=cx-startX; dx=Math.max(-260, Math.min(170, dx)); curTrans=dx; setTrans(dx); };
    const onEnd=()=>{ if(!dragging) return; dragging=false; r.style.transition='transform 0.22s'; if(curTrans<-120) setTrans(-170); else if(curTrans>90) setTrans(140); else setTrans(0); };

        if (result.error) throw result.error;

        const user = result.data.user || (result.data.session && result.data.session.user);
        if (user) enter(user);

        if (plugins.Browser && plugins.Browser.close) {
          await plugins.Browser.close();
        }
      } catch (e) {
        err("aLerr", null, "تعذّر إكمال تسجيل الدخول عبر Google. حاول مرة أخرى.");
      }
    });
  }

  const {data:{session}}=await sb.auth.getSession();
  if(session&&!/type=recovery/.test(location.hash))enter(session.user);
  A("auth").querySelectorAll("[data-av]").forEach(b=>b.onclick=()=>show(b.dataset.av));
  A("auth").querySelectorAll("[data-ae]").forEach(b=>b.onclick=()=>{const i=A(b.dataset.ae),s=i.type==="password";i.type=s?"text":"password";b.textContent=s?"إخفاء":"إظهار"});
  
  A("auth").querySelectorAll("[data-ag]").forEach(b =>
    b.onclick = () => busy(b, "جاري التحويل إلى Google…", async () => {
      const native = !!(
        window.Capacitor &&
        window.Capacitor.isNativePlatform &&
        window.Capacitor.isNativePlatform()
      );

      const { data, error } = await sb.auth.signInWithOAuth({
        provider: "google",
        options: {
          redirectTo: native
            ? "com.arabchat.app://login-callback"
            : location.origin + location.pathname,
          skipBrowserRedirect: native
        }
      });

      if (error) {
        err(A("al").hidden ? "aRerr" : "aLerr", null, ar(error.message));
        return;
      }

      if (native && data && data.url) {
        try {
          const Browser = window.Capacitor.Plugins.Browser;
          if (!Browser) throw new Error("Browser plugin unavailable");
          await Browser.open({ url: data.url });
        } catch (e) {
          err("aLerr", null, "تعذّر فتح المتصفح. تحقق من إعداد مكتبة Browser.");
        }
      }
    })
  );

  A("aLb").onclick=()=>{show("al");const e=A("aLe").value.trim().toLowerCase(),p=A("aLp").value;
    if(!okm(e))return err("aLerr","aLe","أدخل بريداً إلكترونياً صحيحاً");if(!p)return err("aLerr","aLp","أدخل كلمة المرور");
    busy(A("aLb"),"جاري الدخول…",async()=>{const {data,error}=await sb.auth.signInWithPassword({email:e,password:p});if(error)return err("aLerr",null,ar(error.message));enter(data.user)})};
  A("aRb").onclick=()=>{show("ar");const n=A("aRn").value.trim(),e=A("aRe").value.trim().toLowerCase(),p=A("aRp").value;
    if(n.length<2)return err("aRerr","aRn","أدخل اسمك");if(!okm(e))return err("aRerr","aRe","أدخل بريداً إلكترونياً صحيحاً");if(p.length<6)return err("aRerr","aRp","كلمة المرور 6 أحرف على الأقل");
    busy(A("aRb"),"جاري الإنشاء…",async()=>{const {data,error}=await sb.auth.signUp({email:e,password:p,options:{data:{name:n},emailRedirectTo:location.origin+location.pathname}});if(error)return err("aRerr",null,ar(error.message));
      if(data.session)enter(data.user);else{show("al");err("aLerr",null,"أرسلنا رابط تأكيد إلى بريدك، فعّله ثم سجّل الدخول",true)}})};
  A("aFb").onclick=()=>{show("af");if(recovery)es.style.display="none";
    if(recovery){const p=A("aFp").value;if(p.length<6)return err("aFerr","aFp","كلمة المرور الجديدة 6 أحرف على الأقل");
      return busy(A("aFb"),"جاري الحفظ…",async()=>{const {data,error}=await sb.auth.updateUser({password:p});if(error)return err("aFerr",null,ar(error.message));history.replaceState(null,"",location.pathname);enter(data.user)})}
    const e=A("aFe").value.trim().toLowerCase();if(!okm(e))return err("aFerr","aFe","أدخل بريداً إلكترونياً صحيحاً");
    busy(A("aFb"),"جاري الإرسال…",async()=>{const {error}=await sb.auth.resetPasswordForEmail(e,{redirectTo:location.origin+location.pathname});if(error)return err("aFerr",null,ar(error.message));err("aFerr",null,"إذا كان البريد مسجّلاً فسيصلك رابط إعادة التعيين",true)})};
  A("auth").querySelectorAll("input").forEach(i=>i.addEventListener("keydown",e=>{if(e.key==="Enter")i.closest("section").querySelector(".ab.p").click()}));
}
AUTH(init);
</script>
</body>
</html>
