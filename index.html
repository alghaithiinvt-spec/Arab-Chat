(function(){
  function hardFix(){
    const pf = document.querySelector('.pf');
    const root = document.getElementById('root');
    const vx = document.querySelector('.vx');
    const nav = document.querySelector('.bottom-nav');
    if(root){
      root.style.height='100dvh';
      root.style.overflow='hidden';
      root.style.display='flex';
      root.style.flexDirection='column';
    }
    if(pf){
      pf.style.height='100dvh';
      pf.style.overflow='hidden';
      pf.style.display='flex';
      pf.style.flexDirection='column';
    }
    if(vx){
      vx.style.flex='1';
      vx.style.overflowY='auto';
      vx.style.height='calc(100dvh - 80px)';
      vx.style.webkitOverflowScrolling='touch';
    }
    if(nav){
      nav.style.position='fixed';
      nav.style.bottom='0';
      nav.style.left='50%';
      nav.style.transform='translateX(-50%)';
      nav.style.zIndex='9999';
      nav.style.width='100%';
      nav.style.maxWidth='480px';
      // انقله ليكون مباشر تحت body حتى لا يتأثر بـ overflow
      if(nav.parentElement && nav.parentElement.classList.contains('pf')){
        // اتركه لكن تأكد ان pf لا يحتوي transform
      }
    }
    // ثبت كل الهيدرات
    document.querySelectorAll('.header, .messages-header, [class*="page-header"]').forEach(h=>{
      h.style.position='sticky';
      h.style.top='0';
      h.style.zIndex='500';
    });
  }
  document.addEventListener('DOMContentLoaded', hardFix);
  window.addEventListener('load', hardFix);
  setTimeout(hardFix, 100);
  setTimeout(hardFix, 600);
  setTimeout(hardFix, 1500);
  // راقب التغييرات
  new MutationObserver(hardFix).observe(document.body, {childList:true, subtree:true});
  // عند التمرير لا تحرك الناف
  window.addEventListener('scroll', (e)=>{
    const nav = document.querySelector('.bottom-nav');
    if(nav) nav.style.transform='translateX(-50%)';
  }, {passive:true});
})();
</script>

      if(el.tagName==='BUTTON' && el.textContent.includes('بلاس') && el.textContent.length<25){
        let r=el.getBoundingClientRect();
        if(r.top<400){
          let big = el.closest('div')?.parentElement?.textContent||'';
          if(!big.includes('إدارة الاشتراك') && !big.includes('هدايا مجانية')){
            el.style.setProperty('display','none','important');
          }
        }
      }
    });
  }
  setInterval(hideAccountPlus, 800);
  document.addEventListener('DOMContentLoaded', hideAccountPlus);
  window.addEventListener('load', hideAccountPlus);
})();
</script>

<script>
(function(){
  async function ensureRealLogin(){
    try{
      // انتظر Supabase
      await new Promise(r=>setTimeout(r, 2000));
      const sb = window.sb;
      if(!sb) return;
      const { data: { session } } = await sb.auth.getSession();
      const currentUserLS = localStorage.getItem('ahmad_2002') || localStorage.getItem('batsho_user');
      // اذا الجلسة وهمية أو ahmad_2002
      let isFake = false;
      // تحقق من DOM اذا يعرض أحمد محمد
      if(document.body.textContent.includes('أحمد محمد') && document.body.textContent.includes('ahmad_2002@')){
        // تحقق هل هو مستخدم حقيقي مسجل؟
        if(!session){
          isFake = true;
        }
      }
      if(isFake || !session){
        console.log('Fake user detected, forcing logout...');
        // سجل خروج
        await sb.auth.signOut();
        try{ localStorage.clear(); sessionStorage.clear(); }catch(e){}
        // احذف كل شيء واظهر تسجيل الدخول
        // ابحث عن زر تسجيل الدخول واظهره
        // اعادة تحميل الصفحة لتظهر شاشة الدخول الحقيقية
        setTimeout(()=>{
          if(!window.location.hash.includes('login')){
            // حاول ايجاد مودال تسجيل الدخول في التطبيق
            let loginElements = document.querySelectorAll('[class*="login"], [class*="auth"], [class*="signin"]');
            if(loginElements.length===0){
              // اذا ما لقى، اعمل ريلود ويجب يظهر تسجيل الدخول
              console.log('Reloading to show login...');
              // لا نعمل ريلود لا نهائي
              if(!sessionStorage.getItem('forcedLogoutOnce')){
                sessionStorage.setItem('forcedLogoutOnce','1');
                location.reload();
              }
            }
          }
        }, 1000);
      }
    }catch(e){ console.error('Login check failed', e); }
  }
  window.addEventListener('load', ()=>setTimeout(ensureRealLogin, 2500));
})();
</script>

        <div style="width:64px;height:64px;background:linear-gradient(135deg,#8B5CF6,#EC4899);border-radius:20px;display:grid;place-items:center;margin:0 auto 16px;font-size:28px;">🔒</div>

        <button id="gate-signup-btn" style="width:100%;height:48px;background:#252529;color:white;border:1px solid #2A2A32;border-radius:14px;font-weight:700;font-size:14px;cursor:pointer;margin-top:10px;">إنشاء حساب جديد</button>

      // location.reload();

      gate.style.display='none';
    };
  }

  async function checkAndGate(){
    await new Promise(r=>setTimeout(r, 3000));
    try{
      const sb = window.sb;
      if(!sb) return;
      const { data: { session } } = await sb.auth.getSession();
      if(!session){
        // لا يوجد تسجيل حقيقي، اظهر البوابة
        // تأكد انه ليس مجرد تأخير
        setTimeout(async ()=>{
          const { data: { session: s2 } } = await sb.auth.getSession();
          if(!s2){
            createLoginGate();
          }
        }, 2000);
      }
    }catch(e){}
  }

  window.addEventListener('load', checkAndGate);
})();
</script>
