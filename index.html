body.vidmode{background:#0b0c0e}body.vidmode main{padding:0}body.vidmode nav{background:#0b0c0e;border-top-color:#1d2024}
.vx{display:flex;flex-direction:column;height:calc(100dvh - 76px - env(safe-area-inset-bottom,0px) - env(safe-area-inset-top,0px));min-height:420px;background:#0b0c0e;color:#fff}

/* ===== تصميم Roro الجديد ===== */
:root{--bg:#121212;--card:#1E1E1F;--card2:#2A2A32;--tx:#fff;--mut:#9A9AAA;--bd:#2A2A32;--pr:#FF3D81;--prt:#fff;--pu:#8B3DFF;--gn:#00D44A;--og:#FF9F2A;--me:#FF3D81;--g:linear-gradient(135deg,#FF3D81,#8B3DFF)}
html{background:#0c0c0d}
body,body.imo,body.vidmode{background:var(--bg);font-family:'Cairo',sans-serif}
body{max-width:480px;margin:0 auto;width:100%}body.vidmode{max-width:none}
button,input,textarea,select{font-family:'Cairo',sans-serif}
main{min-height:0;padding:12px 16px}body.vidmode main{padding:0}
.av{color:#fff}
.header{display:flex;justify-content:space-between;align-items:center;padding:10px 16px;background:rgba(18,18,18,.96);backdrop-filter:blur(16px);border-bottom:1px solid rgba(255,255,255,.06);flex:none;z-index:60}
body.vidmode .header{display:none}
.logo{font-size:26px;font-weight:800;background:var(--g);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;direction:ltr}
.icon-btn{width:38px;height:38px;border-radius:12px;background:var(--card);border:1px solid var(--bd);color:var(--mut);font-size:18px;display:flex;align-items:center;justify-content:center;cursor:pointer;position:relative;padding:0}
.icon-btn i{position:absolute;top:6px;inset-inline-end:7px;width:9px;height:9px;border-radius:50%;background:var(--pr);border:2px solid var(--card)}.icon-btn i[hidden]{display:none}
nav{display:flex;justify-content:space-around;align-items:flex-end;background:rgba(18,18,18,.97);backdrop-filter:blur(20px);border-top:1px solid rgba(255,255,255,.08);border-radius:24px 24px 0 0;height:80px;padding:6px 0 calc(10px + env(safe-area-inset-bottom,0px));flex:none;position:relative;z-index:30;box-sizing:content-box}
.nav-item{display:flex;flex-direction:column;align-items:center;gap:3px;cursor:pointer;color:var(--mut);font-size:10px;font-weight:600;flex:1;padding-top:4px;position:relative;outline-offset:2px}
.nav-item.active{color:var(--pr)}.nav-item.active::after{content:'';position:absolute;bottom:-6px;width:4px;height:4px;background:var(--pr);border-radius:50%}
.nav-icon{font-size:22px;position:relative;line-height:1.2}
.nbadge{position:absolute;top:-4px;inset-inline-end:-10px;background:var(--pr);color:#fff;font-style:normal;font-size:10px;font-weight:800;min-width:16px;height:16px;border-radius:8px;display:grid;place-items:center;padding:0 4px}
.nav-center-wrap{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;cursor:pointer;color:var(--mut);font-size:10px;font-weight:600}
.center-btn{width:56px;height:56px;border-radius:50%;background:var(--g);display:flex;align-items:center;justify-content:center;font-size:24px;color:#fff;box-shadow:0 6px 20px rgba(255,61,129,.4);margin-top:-18px;position:relative}
.center-btn::before{content:'';position:absolute;inset:-8px;border-radius:50%;background:var(--g);opacity:.18;animation:glowRing 2.2s infinite;z-index:-1}
@keyframes glowRing{0%{transform:scale(.85)}50%{transform:scale(1.18)}100%{transform:scale(.85)}}
@media(prefers-reduced-motion:reduce){.center-btn::before{animation:none}}
.toast{position:fixed;bottom:100px;left:50%;transform:translateX(-50%);background:rgba(28,28,32,.94);border:1px solid rgba(255,255,255,.1);color:#fff;padding:9px 18px;border-radius:22px;font-size:12px;font-weight:600;z-index:300;display:none;max-width:90%;text-align:center}
/* أزرار */
.btn:not(.o):not(.s){background:var(--g);color:#fff}.btn.o{color:var(--pr);border-color:var(--pr)}.btn{border-radius:14px}
.ab.p,.vbig,.vmsg button,.fb:not(.o),.sd{background:var(--g);color:#fff}.ab.s,.lnk,.aeye{color:var(--pr)}.ab.s{border-color:var(--pr)}.aer.okk,.msg.ok{color:var(--gn)}
#auth{background:radial-gradient(circle at 20% 0%,rgba(139,61,255,.28),#121212 60%)}
.tg input{accent-color:#FF3D81}.cap.m{background:var(--g);color:#fff}.vcount i{background:var(--gn)}
.sw button.on{border-color:#fff}
.seg{background:none;padding:0;gap:8px}.seg button{flex:0 0 auto;padding:7px 16px;border-radius:20px;background:var(--card);border:1px solid var(--bd);font-size:12px;font-weight:600;color:var(--mut)}
.seg button.on{background:rgba(255,61,129,.13);border-color:var(--pr);color:var(--pr)}
/* الدردشة */
.m{border-radius:18px;font-size:13px;line-height:1.6}
.m.me{background:var(--g);color:#fff;border-color:transparent;border-bottom-right-radius:6px}.m:not(.me){border-bottom-left-radius:6px}

      let r = sb.from(T).select("path,data").eq("parent", path);
      for (const [f, op, v] of q.w) {
        if (op === "==") r = r.eq("data->>" + f, String(v));
        else if (op === "array-contains") r = r.filter("data->" + f, "cs", JSON.stringify([v]));
      }
      if (q.o) r = r.order("data->" + q.o[0], { ascending: q.o[1] !== "desc" });
      if (q.l) r = r.limit(q.l);
      const { data, error } = await r; if (error) throw error;
      return (data || []).map(x => [x.path, x.data]);

    return {
      doc: id => docRef(path + "/" + id),
      where: (f, op, v) => col(path, { ...q, w: [...q.w, [f, op, v]] }),
      orderBy: (f, dir) => col(path, { ...q, o: [f, dir] }),

        subs.add(f); f(); return () => { alive = false; subs.delete(f); };

async function flipCam(){vs.facing=vs.facing==="user"?"environment":"user";if(!vs.st){paintCtl();return}
  try{const ns=await navigator.mediaDevices.getUserMedia({video:{facingMode:vs.facing}}),nt=ns.getVideoTracks()[0];nt.enabled=vs.cam;
    const old=vs.st.getVideoTracks()[0];if(vs.pc){const sd=vs.pc.getSenders().find(s=>s.track&&s.track.kind==="video");if(sd)await sd.replaceTrack(nt)}
    if(old){vs.st.removeTrack(old);old.stop()}vs.st.addTrack(nt);$("lv").srcObject=vs.st;paintCtl()}

async function findPerson(){endCall();spin(true);say("جاري البحث عن شخص…");
  try{const s=await db.collection("vq").limit(10).get(),o=s.docs.find(d=>d.id!==me&&Date.now()-(d.data().ts||0)<60000);

  }catch(e){spin(false);say("حدث خطأ في الاتصال")}}
async function call(caller,id,other,box,extra){vs.id=id;vs.dpeer=box==="dcall"?other:null;
  vs.peer=other||id.split("_").slice(0,2).find(x=>x!==me)||null;
  const pc=vs.pc=new RTCPeerConnection({iceServers:[{urls:"stun:stun.l.google.com:19302"}]});
  vs.st.getTracks().forEach(t=>pc.addTrack(t,vs.st));
  const wire=dc=>{vs.dc=dc;dc.onmessage=e=>cap("o",String(e.data).slice(0,300))};
  if(caller)wire(pc.createDataChannel("chat"));else pc.ondatachannel=e=>wire(e.channel);
  pc.ontrack=e=>{const rv=$("rv"),rw=$("rvw");if(!rv)return;rv.srcObject=e.streams[0];rv.muted=vs.muteRemote;spin(false);say("");
    if(rw){rw.classList.remove("in");void rw.offsetWidth;rw.classList.add("in")}};
  pc.onconnectionstatechange=()=>{if(["disconnected","failed"].includes(pc.connectionState)){spin(false);say("انتهى الاتصال، اضغط «التالي»")}};
  const cr=db.collection("calls").doc(id),cc=cr.collection("c");let got=false,ready=false;const pend=[];
  const add=c=>pc.addIceCandidate(JSON.parse(c)).catch(()=>{});
  const flush=()=>{ready=true;pend.splice(0).forEach(add)};
  pc.onicecandidate=e=>{if(e.candidate)cc.doc(Date.now()+"_"+Math.random().toString(36).slice(2,6)).set({from:me,c:JSON.stringify(e.candidate)})};
  vs.un.push(cc.onSnapshot(s=>s.docChanges().forEach(ch=>{const d=ch.doc.data();if(ch.type==="added"&&d.from!==me){ready?add(d.c):pend.push(d.c)}})));
  spin(true);say("تم العثور على شخص، جاري الاتصال…");
  if(caller){const off=await pc.createOffer();await pc.setLocalDescription(off);
    await cr.set({from:me,offer:{type:off.type,sdp:off.sdp}});await db.collection(box||"vmatch").doc(other).set({call:id,...(extra||{})});
    vs.un.push(cr.onSnapshot(async s=>{const d=s.data();if(d&&d.answer&&!got){got=true;await pc.setRemoteDescription(d.answer);flush()}}))}
  else{vs.un.push(cr.onSnapshot(async s=>{const d=s.data();if(d&&d.offer&&!got){got=true;await pc.setRemoteDescription(d.offer);flush();const a=await pc.createAnswer();await pc.setLocalDescription(a);await cr.update({answer:{type:a.type,sdp:a.sdp}})}}))}}

    db.collection("chats").where("members","array-contains",me).onSnapshot(s=>{chats=s.docs.map(d=>({id:d.id,...d.data()})).filter(c=>!(c.members||[]).some(x=>String(x).startsWith("ai_")));drawNav();if(cur){const cc=chats.find(x=>x.id===cur);if(cc&&cc["u_"+me])db.collection("chats").doc(cur).update({["u_"+me]:0})}if(tab==="c"&&!document.activeElement?.matches("input,textarea,select"))render()});

    render();
  }catch(e){db=null;render()}}

async function AUTH(start){
  const A=id=>document.getElementById(id),okm=e=>/^\S+@\S+\.\S+$/.test(e);let started=false,recovery=false;
  const enter=u=>{window.__uid=u.id;window.__name=(u.user_metadata&&u.user_metadata.name)||(u.email||"").split("@")[0]||"مستخدم";A("auth").hidden=true;if(!started){started=true;window.connectRealtime();start()}};
  const show=v=>{["al","ar","af"].forEach(x=>A(x).hidden=x!==v);A("auth").querySelectorAll(".aer").forEach(e=>{e.textContent="";e.className="aer"});A("auth").querySelectorAll("input").forEach(i=>i.classList.remove("bad"))};
  const err=(id,inp,m,good)=>{const e=A(id);e.textContent=m;e.className="aer"+(good?" okk":"");if(inp){A(inp).classList.add("bad");A(inp).focus()}};
  const ar=m=>/Invalid login/i.test(m)?"البريد أو كلمة المرور غير صحيحة":/not confirmed/i.test(m)?"فعّل بريدك أولاً من الرسالة التي وصلتك":/already registered/i.test(m)?"هذا البريد مسجّل مسبقاً، سجّل الدخول":/provider is not enabled|Unsupported provider/i.test(m)?"الدخول بـ Google غير مفعّل في Supabase بعد":/Unregistered API key|Invalid API key/i.test(m)?"مفتاح Supabase داخل index.html غير صحيح. انسخ مفتاح Publishable من Settings ← API Keys واستبدله":/rate limit|too many/i.test(m)?"محاولات كثيرة، انتظر قليلاً":/network|fetch/i.test(m)?"تعذّر الاتصال بالإنترنت":m;
  const busy=async(b,t,fn)=>{const o=b.innerHTML;b.disabled=true;b.textContent=t;try{await fn()}finally{b.disabled=false;b.innerHTML=o}};
  const ps=A("aFp").parentElement,es=A("aFe").parentElement;ps.style.display="none";
  (async()=>{try{const r=await fetch(SB_CFG.url+"/auth/v1/settings",{headers:{apikey:SB_CFG.key}});if(!r.ok)return;const s=await r.json();if(s&&s.external&&s.external.google===false)A("auth").querySelectorAll("[data-ag]").forEach(b=>{const n=b.nextElementSibling;b.style.display="none";if(n&&n.classList.contains("aor"))n.style.display="none"})}catch(e){}})();
  sb.auth.onAuthStateChange(ev=>{if(ev==="PASSWORD_RECOVERY"){recovery=true;A("auth").hidden=false;show("af");es.style.display="none";ps.style.display="";A("aFb").textContent="حفظ كلمة المرور الجديدة"}});
  
  const cap = window.Capacitor;
  const plugins = cap && cap.Plugins;

  if (cap && cap.isNativePlatform && cap.isNativePlatform() && plugins && plugins.App) {
    plugins.App.addListener("appUrlOpen", async ({ url }) => {
      if (!url || !url.startsWith("com.arabchat.app://login-callback")) return;

      try {
        const u = new URL(url);
        const params = new URLSearchParams(u.hash.replace(/^#/, ""));
        const code = u.searchParams.get("code");
        let result;

        if (code) {
          result = await sb.auth.exchangeCodeForSession(code);
        } else if (params.get("access_token") && params.get("refresh_token")) {
          result = await sb.auth.setSession({
            access_token: params.get("access_token"),
            refresh_token: params.get("refresh_token")
          });
        } else {
          err("aLerr", null, "لم تصل بيانات جلسة Google. حاول تسجيل الدخول مجددًا.");
          return;
        }

        if (result.error) throw result.error;

        const user = result.data.user || (result.data.session && result.data.session.user);
        if (user) enter(user);

        if (plugins.Browser && plugins.Browser.close) {
          await plugins.Browser.close();
        }
      } catch (e) {
        err("aLerr", null, "تعذّر إكمال تسجيل الدخول عبر Google. حاول مرة أخرى.");
      }
    });
  }

  const {data:{session}}=await sb.auth.getSession();
  if(session&&!/type=recovery/.test(location.hash))enter(session.user);
  A("auth").querySelectorAll("[data-av]").forEach(b=>b.onclick=()=>show(b.dataset.av));
  A("auth").querySelectorAll("[data-ae]").forEach(b=>b.onclick=()=>{const i=A(b.dataset.ae),s=i.type==="password";i.type=s?"text":"password";b.textContent=s?"إخفاء":"إظهار"});
  
  A("auth").querySelectorAll("[data-ag]").forEach(b =>
    b.onclick = () => busy(b, "جاري التحويل إلى Google…", async () => {
      const native = !!(
        window.Capacitor &&
        window.Capacitor.isNativePlatform &&
        window.Capacitor.isNativePlatform()
      );

      const { data, error } = await sb.auth.signInWithOAuth({
        provider: "google",
        options: {
          redirectTo: native
            ? "com.arabchat.app://login-callback"
            : location.origin + location.pathname,
          skipBrowserRedirect: native
        }
      });

      if (error) {
        err(A("al").hidden ? "aRerr" : "aLerr", null, ar(error.message));
        return;
      }

      if (native && data && data.url) {
        try {
          const Browser = window.Capacitor.Plugins.Browser;
          if (!Browser) throw new Error("Browser plugin unavailable");
          await Browser.open({ url: data.url });
        } catch (e) {
          err("aLerr", null, "تعذّر فتح المتصفح. تحقق من إعداد مكتبة Browser.");
        }
      }
    })
  );

  A("aLb").onclick=()=>{show("al");const e=A("aLe").value.trim().toLowerCase(),p=A("aLp").value;
    if(!okm(e))return err("aLerr","aLe","أدخل بريداً إلكترونياً صحيحاً");if(!p)return err("aLerr","aLp","أدخل كلمة المرور");
    busy(A("aLb"),"جاري الدخول…",async()=>{const {data,error}=await sb.auth.signInWithPassword({email:e,password:p});if(error)return err("aLerr",null,ar(error.message));enter(data.user)})};
  A("aRb").onclick=()=>{show("ar");const n=A("aRn").value.trim(),e=A("aRe").value.trim().toLowerCase(),p=A("aRp").value;
    if(n.length<2)return err("aRerr","aRn","أدخل اسمك");if(!okm(e))return err("aRerr","aRe","أدخل بريداً إلكترونياً صحيحاً");if(p.length<6)return err("aRerr","aRp","كلمة المرور 6 أحرف على الأقل");
    busy(A("aRb"),"جاري الإنشاء…",async()=>{const {data,error}=await sb.auth.signUp({email:e,password:p,options:{data:{name:n},emailRedirectTo:location.origin+location.pathname}});if(error)return err("aRerr",null,ar(error.message));
      if(data.session)enter(data.user);else{show("al");err("aLerr",null,"أرسلنا رابط تأكيد إلى بريدك، فعّله ثم سجّل الدخول",true)}})};
  A("aFb").onclick=()=>{show("af");if(recovery)es.style.display="none";
    if(recovery){const p=A("aFp").value;if(p.length<6)return err("aFerr","aFp","كلمة المرور الجديدة 6 أحرف على الأقل");
      return busy(A("aFb"),"جاري الحفظ…",async()=>{const {data,error}=await sb.auth.updateUser({password:p});if(error)return err("aFerr",null,ar(error.message));history.replaceState(null,"",location.pathname);enter(data.user)})}
    const e=A("aFe").value.trim().toLowerCase();if(!okm(e))return err("aFerr","aFe","أدخل بريداً إلكترونياً صحيحاً");
    busy(A("aFb"),"جاري الإرسال…",async()=>{const {error}=await sb.auth.resetPasswordForEmail(e,{redirectTo:location.origin+location.pathname});if(error)return err("aFerr",null,ar(error.message));err("aFerr",null,"إذا كان البريد مسجّلاً فسيصلك رابط إعادة التعيين",true)})};
  A("auth").querySelectorAll("input").forEach(i=>i.addEventListener("keydown",e=>{if(e.key==="Enter")i.closest("section").querySelector(".ab.p").click()}));
}
AUTH(init);
</script>
