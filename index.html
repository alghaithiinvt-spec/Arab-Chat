<script>
/* backend.js — طبقة بيانات محلية تحاكي Firebase Firestore.
   تحفظ البيانات في localStorage وتزامنها بين التبويبات (كل تبويب = مستخدم مختلف).
   لربط التطبيق بخادم حقيقي: استبدل هذا الملف بنسخة تعيد نفس الدوال (انظر README). */
(function () {
  const KEY = "ac_db", BOT = "bot_sara";
  const bc = new BroadcastChannel("ac"), subs = new Set();
  const load = () => JSON.parse(localStorage.getItem(KEY) || "{}");
  const fire = () => subs.forEach(f => f());
  const save = d => { localStorage.setItem(KEY, JSON.stringify(d)); bc.postMessage(1); fire(); };
  bc.onmessage = fire;
  addEventListener("storage", e => { if (e.key === KEY) fire(); });
  const parent = p => p.slice(0, p.lastIndexOf("/"));
  const snapD = (p, d) => ({ id: p.split("/").pop(), exists: d !== undefined, data: () => d === undefined ? undefined : JSON.parse(JSON.stringify(d)), metadata: {} });

  function col(path, q = { w: [], o: null, l: 0 }) {
    const run = () => {
      let r = Object.entries(load()).filter(([k]) => parent(k) === path);
      q.w.forEach(([f, op, v]) => r = r.filter(([, x]) => op === "==" ? x[f] === v : op === "array-contains" ? (x[f] || []).includes(v) : true));
      if (q.o) r.sort((a, b) => (a[1][q.o[0]] > b[1][q.o[0]] ? 1 : -1) * (q.o[1] === "desc" ? -1 : 1));
      return q.l ? r.slice(0, q.l) : r;
    };
    const mk = prev => { const docs = run().map(([k, x]) => snapD(k, x)); return { docs, size: docs.length, empty: !docs.length, metadata: {}, docChanges: () => docs.filter(d => !prev.has(d.id)).map(doc => ({ type: "added", doc })) }; };
    return {
      doc: id => docRef(path + "/" + id),
      where: (f, op, v) => col(path, { ...q, w: [...q.w, [f, op, v]] }),
      orderBy: (f, dir) => col(path, { ...q, o: [f, dir] }),
      limit: n => col(path, { ...q, l: n }),
      get: async () => mk(new Set()),
      onSnapshot(cb) {
        let prev = new Set(), last;
        const f = () => { const j = JSON.stringify(run()); if (j === last) return; last = j; const s = mk(prev); prev = new Set(s.docs.map(d => d.id)); cb(s); };
        subs.add(f); setTimeout(f, 0); return () => subs.delete(f);
      }
    };
  }
  function docRef(path) {
    return {
      id: path.split("/").pop(), path,
      get: async () => snapD(path, load()[path]),
      set: async v => { const d = load(); d[path] = v; save(d); },
      update: async v => { const d = load(); d[path] = { ...(d[path] || {}), ...v }; save(d); },
      delete: async () => { const d = load(); Object.keys(d).forEach(k => { if (k === path || k.startsWith(path + "/")) delete d[k]; }); save(d); },
      collection: p => col(path + "/" + p),
      onSnapshot(cb) {
        let last; const f = () => { const v = load()[path], j = JSON.stringify(v); if (j !== last) { last = j; cb(snapD(path, v)); } };
        subs.add(f); setTimeout(f, 0); return () => subs.delete(f);
      }
    };
  }
  const db = { collection: p => col(p) };
  const user = { id: async () => sessionStorage.ac_uid, me: async () => ({ name: sessionStorage.ac_name || "" }), isOwner: () => true, canEdit: () => true };
  window.claude = { use: async n => n === "db" ? db : n === "user" ? user : null };

  /* شريك تجريبي: إذا انتظرت 5 ثوانٍ بلا أحد، يتصل بك "سارة" لتجرب الواجهة وحدك */
  const done = new Set();
  setInterval(() => {
    const d = load(); let ch = false;
    for (const k in d) {
      if (parent(k) === "queue" && Date.now() - d[k].ts > 5000) {
        const u = k.split("/")[1]; if (u === BOT || d["matches/" + u]) continue;
        const id = u + "_" + BOT + "_" + Date.now();
        d["chats/" + id] = { a: u, b: BOT, na: d[k].name, nb: "سارة (تجريبي)", members: [u, BOT], last: "", ts: Date.now() };
        d["matches/" + u] = { chat: id }; delete d[k]; ch = true;
      }
      const m = k.match(/^(chats\/[^/]+)\/msgs\/([^/]+)$/);
      if (m && d[k].from !== BOT && (d[m[1]].members || []).includes(BOT) && !d["botdone/" + m[2]] && !done.has(m[2])) {
        done.add(m[2]); d["botdone/" + m[2]] = { t: 1 }; ch = true;
        const R = ["أهلاً وسهلاً! 😊", "من أي بلد أنت؟", "حلو، وش تحب تسوي في وقت فراغك؟", "ههه صحيح", "تشرفت بمعرفتك!"];
        setTimeout(() => { const x = load(), ts = Date.now(), t = R[Math.floor(Math.random() * R.length)];
          x[m[1] + "/msgs/" + ts + "_bot"] = { from: BOT, text: t, ts }; if (x[m[1]]) { x[m[1]].last = t; x[m[1]].ts = ts; } save(x); }, 1200);
      }
    }
    if (ch) save(d);
  }, 1000);
})();

</script>
<script>
const $=id=>document.getElementById(id);
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
let db,user,me,myName="",tab="r",searching=false,chats=[],followers=[],following=[],cur=null,msgUn=null,chatUn=null,matchUn=null,peer=null,fid=null;
const IC={r:'<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M21 12a8 8 0 0 1-11.6 7.1L4 20l1-4.6A8 8 0 1 1 21 12z"/><path d="M8.5 12h.01M12 12h.01M15.5 12h.01"/></svg>',v:'<svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="6" width="13" height="12" rx="3"/><path d="M16 10l5-3v10l-5-3z"/></svg>',c:'<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 15a2 2 0 0 1-2 2H8l-4 4V5a2 2 0 0 1 2-2h12a2 2 0 0 1 2 2z"/><path d="M8 8h8M8 12h5"/></svg>',p:'<svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 4-6 8-6s8 2 8 6"/></svg>'};
const tabs=[["r","دردشة عشوائية"],["v","فيديو عشوائي"],["c","المحادثات"],["p","حسابي"]];

function drawNav(){$("nav").innerHTML=tabs.map(([k,t])=>`<button class="${k===tab?"on":""}" data-k="${k}">${IC[k]}${t}</button>`).join("");
  $("nav").querySelectorAll("button").forEach(b=>b.onclick=()=>{tab=b.dataset.k;render()})}

function render(){drawNav();const m=$("main");if(tab!=="v"&&vs.pc)stopVideo();
  if(!db){m.innerHTML='<div class="center">تعذّر تشغيل التطبيق. تأكد أن المتصفح يسمح بالتخزين المحلي (localStorage) وأنك لست في وضع التصفح الخاص.</div>';return}
  if(tab==="r"){
    m.innerHTML=searching
      ?`<div class="center"><div class="rd pl"><i class="r1"></i><i class="r2"></i><i class="r3">💬</i></div><h2>جاري البحث عن شخص…</h2><p class="mut" style="white-space:normal">ابقَ هنا، سنربطك بأول شخص متاح.</p><button class="btn o" id="cn">إلغاء</button></div>`
      :`<div class="center"><div class="rd"><i class="r1"></i><i class="r2"></i><i class="r3">💬</i></div><h2>ابحث عن شخص جديد</h2><p class="mut" style="white-space:normal">سيتم ربطك بأول شخص متاح الآن.</p><button class="btn" id="go" style="width:100%;padding:15px">ابدأ الدردشة</button></div>`;
    if($("go"))$("go").onclick=findMatch;if($("cn"))$("cn").onclick=cancel;
  }else if(tab==="v"){vidView()}else if(tab==="c"){
    const l=[...chats].sort((a,b)=>b.ts-a.ts);
    m.innerHTML=l.length?l.map(c=>{const n=c.a===me?c.nb:c.na;return `<div class="card" data-id="${esc(c.id)}"><div class="av">${esc((n||"؟")[0])}</div><div class="grow"><b>${esc(n)}</b><div class="mut">${esc(c.last||"لا رسائل بعد")}</div></div></div>`}).join(""):'<div class="center mut">لا توجد محادثات بعد</div>';
    m.querySelectorAll(".card").forEach(e=>e.onclick=()=>openChat(e.dataset.id));
  }else{return profView(m);
    const ul=(a,k,un)=>a.length?a.map(f=>{const id=f[k==="to"?"to":"from"],n=f[k==="to"?"toName":"fromName"];return `<div class="card"><div class="av">${esc((n||"؟")[0])}</div><div class="grow"><b>${esc(n)}</b></div>${un?`<button class="btn o s" data-u="${esc(f.id)}">إلغاء المتابعة</button>`:""}</div>`}).join(""):'<div class="mut">لا أحد بعد</div>';
    m.innerHTML=`<div class="card"><div class="av">${esc((myName||"؟")[0])}</div><div class="grow"><input id="nm" value="${esc(myName)}" placeholder="اسمك"></div><button class="btn s" id="sv">حفظ</button></div>
    <div class="tabs"><div class="card grow" style="justify-content:center;flex-direction:column;gap:0"><b>${followers.length}</b><span class="mut">متابِعون</span></div><div class="card grow" style="justify-content:center;flex-direction:column;gap:0"><b>${following.length}</b><span class="mut">أتابعهم</span></div></div>
    <h2>المتابِعون</h2>${ul(followers,"from",false)}<h2>الذين أتابعهم</h2>${ul(following,"to",true)}`;
    $("sv").onclick=async()=>{const v=$("nm").value.trim();if(!v)return;myName=v;await db.collection("profiles").doc(me).set({name:v});$("sv").textContent="تم ✓"};
    m.querySelectorAll("[data-u]").forEach(b=>b.onclick=()=>db.collection("follows").doc(b.dataset.u).delete());
  }}

async function findMatch(){searching=true;render();
  try{
    const s=await db.collection("queue").limit(10).get();
    const o=s.docs.find(d=>d.id!==me&&Date.now()-(d.data().ts||0)<90000);

const vs={pc:null,st:null,un:[],id:null};
const say=t=>{const e=$("vst");if(e)e.textContent=t};
function vidView(){$("main").innerHTML=`<div class="vw"><div class="vp"><video id="rv" autoplay playsinline></video><video id="lv" autoplay playsinline muted></video><div class="vst" id="vst">اضغط «ابدأ» للتحدث بالفيديو مع شخص عشوائي</div></div><div class="ctl"><button class="cb" id="vm">كتم</button><button class="cb g" id="vg">ابدأ</button><button class="cb" id="vx">إنهاء</button></div></div>`;
  $("vg").onclick=startVideo;$("vx").onclick=()=>{stopVideo();vidView()};
  $("vm").onclick=()=>{const t=vs.st&&vs.st.getAudioTracks()[0];if(t){t.enabled=!t.enabled;$("vm").textContent=t.enabled?"كتم":"إلغاء"}}}
function stopVideo(){vs.un.forEach(f=>{try{f()}catch(e){}});vs.un=[];if(vs.pc)vs.pc.close();vs.pc=null;if(vs.st)vs.st.getTracks().forEach(t=>t.stop());vs.st=null;try{db.collection("vq").doc(me).delete();if(vs.id)db.collection("calls").doc(vs.id).delete()}catch(e){}vs.id=null}
async function startVideo(){stopVideo();
  try{vs.st=await navigator.mediaDevices.getUserMedia({video:true,audio:true})}catch(e){say("تعذّر تشغيل الكاميرا أو الميكروفون. اسمح بالوصول، أو جرّب فتح الصفحة في متصفح آخر.");return}
  $("lv").srcObject=vs.st;$("vg").textContent="تخطي";say("جاري البحث عن شخص…");
  try{const s=await db.collection("vq").limit(10).get();
    const o=s.docs.find(d=>d.id!==me&&Date.now()-(d.data().ts||0)<60000);
    if(o){await db.collection("vq").doc(o.id).delete();await call(true,[me,o.id].sort().join("_")+"_"+Date.now(),o.id)}
    else{await db.collection("vq").doc(me).set({ts:Date.now()});
      vs.un.push(db.collection("vmatch").doc(me).onSnapshot(x=>{if(x.exists&&!vs.pc){const id=x.data().call;db.collection("vmatch").doc(me).delete();db.collection("vq").doc(me).delete();call(false,id)}}))}
  }catch(e){say("حدث خطأ في الاتصال")}}
async function call(caller,id,other){vs.id=id;
  const pc=vs.pc=new RTCPeerConnection({iceServers:[{urls:"stun:stun.l.google.com:19302"}]});
  vs.st.getTracks().forEach(t=>pc.addTrack(t,vs.st));
  pc.ontrack=e=>{$("rv").srcObject=e.streams[0];say("")};
  pc.onconnectionstatechange=()=>{if(["disconnected","failed"].includes(pc.connectionState))say("انتهى الاتصال، اضغط تخطي")};
  const cr=db.collection("calls").doc(id),cc=cr.collection("c");let got=false,ready=false;const pend=[];
  const add=c=>pc.addIceCandidate(JSON.parse(c)).catch(()=>{});
  const flush=()=>{ready=true;pend.splice(0).forEach(add)};
  pc.onicecandidate=e=>{if(e.candidate)cc.doc(Date.now()+"_"+Math.random().toString(36).slice(2,6)).set({from:me,c:JSON.stringify(e.candidate)})};
  vs.un.push(cc.onSnapshot(s=>s.docChanges().forEach(ch=>{const d=ch.doc.data();if(ch.type==="added"&&d.from!==me){ready?add(d.c):pend.push(d.c)}})));
  say("تم العثور على شخص، جاري الاتصال…");
  if(caller){const off=await pc.createOffer();await pc.setLocalDescription(off);
    await cr.set({from:me,offer:{type:off.type,sdp:off.sdp}});await db.collection("vmatch").doc(other).set({call:id});
    vs.un.push(cr.onSnapshot(async s=>{const d=s.data();if(d&&d.answer&&!got){got=true;await pc.setRemoteDescription(d.answer);flush()}}))}
  else{vs.un.push(cr.onSnapshot(async s=>{const d=s.data();if(d&&d.offer&&!got){got=true;await pc.setRemoteDescription(d.offer);flush();const a=await pc.createAnswer();await pc.setLocalDescription(a);await cr.update({answer:{type:a.type,sdp:a.sdp}})}}))}}

    render();
  }catch(e){db=null;render()}}
