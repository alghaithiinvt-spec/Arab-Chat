name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Download project
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install dependencies
        run: npm install

      - name: Build web files
        run: |
          rm -rf www
          mkdir -p www
          cp index.html www/index.html

      - name: Create Android project if missing
        run: |
          [ -d android ] || npx cap add android

      - name: Generate app icons
        run: npx @capacitor/assets generate --android --iconBackgroundColor '#0a1c1a' --iconBackgroundColorDark '#0a1c1a'

      - name: Allow camera and microphone
        run: |
          python3 - <<'PY'
          p = "android/app/src/main/AndroidManifest.xml"
          s = open(p, encoding="utf-8").read()
          add = '''    <uses-permission android:name="android.permission.CAMERA" />
              <uses-permission android:name="android.permission.RECORD_AUDIO" />
              <uses-permission android:name="android.permission.MODIFY_AUDIO_SETTINGS" />
          '''
          if "RECORD_AUDIO" not in s:
              s = s.replace("</manifest>", add + "</manifest>")
          open(p, "w", encoding="utf-8").write(s)
          PY

      - name: Configure Google login deep link
        run: |
          python3 - <<'PY'
          p = "android/app/src/main/AndroidManifest.xml"
          s = open(p, encoding="utf-8").read()
          intent_filter = '''
              <intent-filter>
                  <action android:name="android.intent.action.VIEW" />
                  <category android:name="android.intent.category.DEFAULT" />
                  <category android:name="android.intent.category.BROWSABLE" />
                  <data android:scheme="com.arabchat.app" android:host="login-callback" />
              </intent-filter>
          '''
          if 'android:host="login-callback"' not in s:
              s = s.replace("</activity>", intent_filter + "\n        </activity>", 1)
          open(p, "w", encoding="utf-8").write(s)
          PY

      - name: Sync Android project
        run: npx cap sync android

      - name: Sync Android project
        run: npx cap sync android

      - name: Build APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: arab-chat-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
